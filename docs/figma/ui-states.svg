<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620">
  <rect width="1440" height="620" fill="#f4f8fc"/>
  <g font-family="Arial, sans-serif" fill="#16324f">
    <text x="60" y="62" font-size="28" font-weight="700">Estados da interface</text><text x="60" y="92" font-size="14" fill="#536b82">Referências visuais para carregamento, erro e ausência de dados.</text>
    <g>
      <rect x="60" y="130" width="420" height="420" rx="16" fill="#fff" stroke="#d7e3ef"/><text x="88" y="174" font-size="13" font-weight="700" fill="#2563eb">CARREGANDO</text><text x="88" y="218" font-size="21" font-weight="700">Buscando cotações</text><text x="88" y="246" font-size="13" fill="#536b82">Aguarde enquanto consultamos os dados.</text><rect x="88" y="280" width="364" height="210" rx="12" fill="#f4f8fc"/><circle cx="270" cy="365" r="25" fill="none" stroke="#d7e3ef" stroke-width="8"/><path d="M270 340A25 25 0 0 1 295 365" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/><rect x="130" y="420" width="280" height="12" rx="6" fill="#d7e3ef"/><rect x="170" y="448" width="200" height="12" rx="6" fill="#e6edf4"/>
      <rect x="510" y="130" width="420" height="420" rx="16" fill="#fff" stroke="#d7e3ef"/><text x="538" y="174" font-size="13" font-weight="700" fill="#b42318">ERRO</text><text x="538" y="218" font-size="21" font-weight="700">Não foi possível carregar</text><text x="538" y="246" font-size="13" fill="#536b82">Confira sua conexão e tente novamente.</text><rect x="538" y="280" width="364" height="210" rx="12" fill="#fff7f6" stroke="#f2c7c3"/><circle cx="720" cy="350" r="25" fill="#fde8e7"/><text x="712" y="359" font-size="25" font-weight="700" fill="#b42318">!</text><text x="720" y="405" text-anchor="middle" font-size="13" fill="#536b82">Os dados não foram atualizados.</text><rect x="640" y="435" width="160" height="40" rx="8" fill="#2563eb"/><text x="720" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Tentar novamente</text>
      <rect x="960" y="130" width="420" height="420" rx="16" fill="#fff" stroke="#d7e3ef"/><text x="988" y="174" font-size="13" font-weight="700" fill="#536b82">SEM DADOS</text><text x="988" y="218" font-size="21" font-weight="700">Nenhuma cotação encontrada</text><text x="988" y="246" font-size="13" fill="#536b82">Tente outro período ou remova os filtros.</text><rect x="988" y="280" width="364" height="210" rx="12" fill="#f4f8fc"/><circle cx="1170" cy="360" r="28" fill="#e8f0fa"/><path d="M1157 360H1183M1170 347V373" stroke="#71869b" stroke-width="3" stroke-linecap="round"/><text x="1170" y="416" text-anchor="middle" font-size="13" fill="#536b82">Os filtros não retornaram registros.</text><text x="1170" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">Limpar filtros</text>
    </g>
  </g>
</svg>
