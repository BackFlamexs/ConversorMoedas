<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1900" viewBox="0 0 390 1900">
  <rect width="390" height="1900" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#20252b">
    <text x="24" y="44" font-size="21" font-weight="700">CÂMBIO</text><text x="250" y="42" font-size="10">CONVERSOR</text><path d="M24 62H366" stroke="#b9c0c8"/>
    <text x="24" y="112" font-size="11">SIMPLES, CLARO E ATUALIZADO</text><text x="24" y="160" font-size="30" font-weight="700">Seu dinheiro,</text><text x="24" y="196" font-size="30" font-weight="700">em qualquer moeda.</text><text x="24" y="228" font-size="14">Converta valores e acompanhe taxas.</text>
    <rect x="20" y="260" width="350" height="460" rx="14" fill="#f7f8fa" stroke="#aeb6bf"/><text x="40" y="300" font-size="21" font-weight="700">Faça uma conversão</text>
    <text x="40" y="345" font-size="13">Você envia</text><rect x="40" y="357" width="310" height="60" rx="8" fill="#fff" stroke="#aeb6bf"/><text x="56" y="394" font-size="21">100</text><text x="276" y="394" font-size="16">BRL ▾</text>
    <text x="185" y="448" font-size="22">↕</text><text x="40" y="492" font-size="13">Você recebe</text><rect x="40" y="504" width="310" height="60" rx="8" fill="#fff" stroke="#aeb6bf"/><text x="56" y="541" font-size="21">—</text><text x="276" y="541" font-size="16">USD ▾</text>
    <rect x="40" y="590" width="310" height="48" rx="8" fill="#d9dde2"/><text x="195" y="620" text-anchor="middle" font-size="15">Converter</text><text x="40" y="675" font-size="12">Taxa e data aparecem após a conversão.</text>
    <text x="24" y="780" font-size="24" font-weight="700">Histórico</text><text x="24" y="810" font-size="13">Par BRL → USD</text>
    <rect x="20" y="830" width="350" height="70" rx="10" fill="#f7f8fa" stroke="#aeb6bf"/><text x="40" y="858" font-size="11">PERÍODO</text><text x="40" y="884" font-size="15">30 dias ▾</text>
    <text x="24" y="935" font-size="12">7d　15d　30d　3m　6m　1a　5a　10a</text>
    <rect x="20" y="960" width="350" height="270" rx="10" fill="#fff" stroke="#aeb6bf"/><text x="40" y="995" font-size="17" font-weight="700">Gráfico de cotação</text><path d="M48 1150L100 1120L150 1140L205 1065L255 1085L335 1030" fill="none" stroke="#727b85" stroke-width="3"/><text x="42" y="1198" font-size="11">datas →　　　　　cotação ↑</text>
    <text x="24" y="1280" font-size="21" font-weight="700">Tabela</text>
    <rect x="20" y="1300" width="350" height="180" rx="10" fill="#f7f8fa" stroke="#aeb6bf"/><text x="38" y="1335" font-size="12">Data inicial ▾</text><text x="210" y="1335" font-size="12">Data final ▾</text><text x="38" y="1380" font-size="12">Cotação mínima</text><text x="210" y="1380" font-size="12">Cotação máxima</text><text x="38" y="1440" font-size="12">[Filtrar]　[Limpar]</text>
    <rect x="20" y="1500" width="350" height="320" rx="10" fill="#fff" stroke="#aeb6bf"/><text x="38" y="1535" font-size="12" font-weight="700">DATA　　 PAR　　 COTAÇÃO</text><path d="M38 1550H352M38 1605H352M38 1660H352M38 1715H352" stroke="#d4d9df"/><text x="38" y="1590" font-size="12">18/10　 BRL/USD　0,18</text><text x="38" y="1645" font-size="12">17/10　 BRL/USD　0,17</text><text x="38" y="1700" font-size="12">16/10　 BRL/USD　0,18</text><text x="38" y="1775" font-size="12">Exportar CSV　　3 registros</text>
